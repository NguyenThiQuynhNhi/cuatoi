<!doctype html>

    />

      }
      .portal-tab-active {

        box-shadow: 0 10px 15px -3px rgb(173 152 110);
      }
      .feature-card:hover {

      }
      .purchased-badge {
        background: linear-gradient(90deg, #10b981, #34d399);
      }
      .admin-input:focus {
        border-color: #ad986e;
        box-shadow: 0 0 0 3px rgba(173, 152, 110, 0.2);

  <body class="text-gray-900">
    <header

      <div

        <div class="flex items-center gap-x-3">

            Y
          </div>
          <div class="text-2xl font-semibold tracking-tighter">Yuushi</div>
          <div class="text-sm font-medium text-gray-400">Feature Store</div>
        </div>

        <div
          class="flex bg-white rounded-3xl border border-[#ad986e]/20 p-1 shadow-sm"
        >
          <button
            onclick="switchPortal(0)"
            id="tab-0"
            class="portal-tab px-6 py-3 text-sm font-semibold flex items-center gap-2"
          >
            Customer
          </button>
          <button
            onclick="switchPortal(1)"
            id="tab-1"
            class="portal-tab px-6 py-3 text-sm font-semibold flex items-center gap-2"
          >
            Agent
          </button>
          <button
            onclick="switchPortal(2)"
            id="tab-2"
            class="portal-tab px-6 py-3 text-sm font-semibold flex items-center gap-2"
          >
            Support A
          </button>
          <button
            onclick="switchPortal(3)"
            id="tab-3"
            class="portal-tab portal-tab-active px-6 py-3 text-sm font-semibold flex items-center gap-2"
          >
            Admin CMS
          </button>
        </div>

        <button
          onclick="toggleCart()"
          class="flex items-center gap-x-3 bg-white border border-[#ad986e]/30 hover:border-[#ad986e] px-6 py-3 rounded-3xl font-medium"
        >
          <i class="fa-solid fa-cart-shopping text-[#ad986e]"></i>
          <span class="hidden sm:inline">Cart</span>
          <div
            id="cart-count"
            class="bg-[#ad986e] text-white text-xs font-bold w-6 h-6 flex items-center justify-center rounded-2xl"
          >
            0
          </div>
          <span id="cart-total-header" class="font-semibold text-[#ad986e]"
            >¥0</span
          >
        </button>
      </div>
    </header>

            id="portal-title"

            Customer Portal

            Overseas Investor Features
          </p>
        </div>
        <div id="active-role" class="font-semibold text-[#ad986e] text-lg">
          Customer
        </div>

      <div id="features-container" class="space-y-16"></div>

    <div
      id="cart-panel"

      <div class="p-6 border-t bg-[#fbf8f5]">

    </div>

          <div id="pay-gateway" class="space-y-6">

                value="4242 4242 4242 4242"
                class="w-full px-4 py-3 border border-gray-200 rounded-2xl text-sm"
                readonly
              />
              <div class="grid grid-cols-2 gap-4 mt-4">

                  value="12/28"
                  class="px-4 py-3 border border-gray-200 rounded-2xl text-sm"
                  readonly
                />
                <input

                  value="424"
                  class="px-4 py-3 border border-gray-200 rounded-2xl text-sm"
                  readonly
                />
              </div>
            </div>
            <button

              class="w-full py-4 bg-[#ad986e] text-white rounded-3xl font-semibold text-lg"
            >

            >

            </button>
          </div>
        </div>

      // Admin Feature CMS (edit small, a-la-carte features)
      function renderFeatureCMS() {
        const container = document.getElementById("feature-cms-list");
        let html = "";

        Object.keys(featuresDB).forEach((portalKey) => {
          html += `<h3 class="text-xl font-semibold mb-4">${portals.find((p) => p.key === portalKey).name} Portal</h3>`;
          Object.keys(featuresDB[portalKey]).forEach((cat) => {
            html += `<div class="mb-8"><div class="text-xs uppercase font-semibold text-gray-500 mb-3">${cat}</div>`;
            featuresDB[portalKey][cat].forEach((f) => {
              html += `
          <div class="bg-white border border-gray-100 rounded-3xl p-6 mb-4">
            <div class="grid grid-cols-12 gap-4 items-end">
              <div class="col-span-5">
                <div class="text-[11px] text-gray-500 mb-1">Feature name</div>
                <input value="${f.name}" onchange="updateFeature('${portalKey}','${f.id}','name',this.value)" class="admin-input w-full font-medium border-b focus:outline-none">
              </div>
              <div class="col-span-2">
                <div class="text-[11px] text-gray-500 mb-1">Price (JPY / month)</div>
                <input type="number" value="${f.price}" onchange="updateFeature('${portalKey}','${f.id}','price',parseInt(this.value)||0)" class="admin-input w-full text-center font-semibold border rounded-2xl py-2">
              </div>
              <div class="col-span-2">
                <div class="text-[11px] text-gray-500 mb-1">Duration (months)</div>
                <input type="number" value="${f.duration || 0}" onchange="updateFeature('${portalKey}','${f.id}','duration',parseInt(this.value)||0)" class="admin-input w-full text-center font-semibold border rounded-2xl py-2">
              </div>
              <div class="col-span-3 text-right">
                <div class="flex items-center justify-end gap-2 mb-1">
                  <span class="text-[11px] text-gray-500">Free / Paid</span>
                  <select onchange="updateFeatureFreePaid('${portalKey}','${f.id}',this.value)" class="admin-input text-[11px] border rounded-2xl px-2 py-1">
                    <option value="free" ${f.price === 0 ? "selected" : ""}>FREE</option>
                    <option value="paid" ${f.price !== 0 ? "selected" : ""}>PAID</option>
                  </select>
                </div>
                <span class="px-4 py-1 text-xs font-bold ${f.price === 0 ? "bg-emerald-100 text-emerald-700" : "bg-[#ad986e] text-white"} rounded-2xl">${f.price === 0 ? "FREE" : "PAID"}</span>
              </div>
            </div>
          </div>`;
            });
            html += `</div>`;
          });
        });
        container.innerHTML = html;
      }

      function updateFeature(portalKey, id, field, value) {
        Object.keys(featuresDB[portalKey]).forEach((cat) => {
          const feature = featuresDB[portalKey][cat].find((f) => f.id === id);
          if (feature) feature[field] = value;
        });
      }

      function updateFeatureFreePaid(portalKey, id, mode) {
        Object.keys(featuresDB[portalKey]).forEach((cat) => {
          const feature = featuresDB[portalKey][cat].find((f) => f.id === id);
          if (!feature) return;
          if (mode === "free") {
            feature.price = 0;
          } else {
            if (!feature.price || feature.price === 0) {
              feature.price = 1000;
            }
          }
        });
        renderFeatureCMS();
      }

      function getPortalFeaturesFlat(portalKey) {
        const portalData = featuresDB[portalKey] || {};
        const list = [];
        Object.keys(portalData).forEach((cat) => {
          portalData[cat].forEach((f) => list.push(f));
        });
        return list;
      }

      function renderPlanManagement() {
        const container = document.getElementById("plan-management");
        container.innerHTML = "";

        ["customer", "agent", "support"].forEach((portalKey) => {
          const column = document.createElement("div");
          const portalMeta = portals.find((p) => p.key === portalKey);
          const plans = plansDB[portalKey] || [];
          const features = getPortalFeaturesFlat(portalKey);

          let inner = `
            <div class="mb-4 flex items-center justify-between">
              <div>
                <h3 class="text-lg font-semibold">${portalMeta.name} Plans</h3>
                <p class="text-xs text-gray-500">${portalMeta.subtitle} bundles</p>
              </div>
              <button onclick="addPlan('${portalKey}')" class="px-3 py-1.5 text-xs rounded-2xl border border-[#ad986e]/40 text-[#ad986e] font-semibold hover:bg-[#ad986e]/5">

              </button>
            </div>
            <div class="space-y-4">
          `;

            inner += `

                      value="${plan.name}"
                      onchange="updatePlanField('${portalKey}','${plan.id}','name',this.value)"

                    <input
                      class="admin-input w-full text-xs text-gray-600 border-b focus:outline-none"
                      value="${plan.label}"
                      placeholder="Label / description"
                      onchange="updatePlanField('${portalKey}','${plan.id}','label',this.value)"

                    <input
                      type="number"

                      onchange="updatePlanField('${portalKey}','${plan.id}','monthlyPrice',parseInt(this.value)||0)"

                  </div>
                </div>
                <div class="mt-3 grid grid-cols-2 gap-3">
                  <div>
                    <label class="block text-[11px] text-gray-500 mb-1">Effective from</label>
                    <input
                      type="date"
                      class="admin-input w-full text-xs border rounded-2xl px-2 py-1.5"
                      value="${plan.effectiveFrom}"
                      onchange="updatePlanField('${portalKey}','${plan.id}','effectiveFrom',this.value)"
                    />
                  </div>
                  <div class="text-right">
                    <button onclick="deletePlan('${portalKey}','${plan.id}')" class="text-[11px] text-red-500 font-medium mt-5">Delete plan</button>

                </div>
                <div class="mt-3">
                  <label class="block text-[11px] text-gray-500 mb-1">Included features</label>
                  <select
                    multiple
                    size="4"
                    class="admin-input w-full text-xs border rounded-2xl px-2 py-1.5"
                    onchange="updatePlanFeatures('${portalKey}','${plan.id}',this)"
                  >
                    ${features
                      .map(
                        (f) => `
                        <option value="${f.id}" ${plan.featureIds.includes(f.id) ? "selected" : ""}>
                          ${f.name}
                        </option>
                      `,
                      )
                      .join("")}

                  <p class="mt-1 text-[10px] text-gray-400">Use Ctrl / ⌘ to select multiple features.</p>

      function updatePlanField(portalKey, planId, field, value) {
        const plans = plansDB[portalKey] || [];
        const plan = plans.find((p) => p.id === planId);
        if (!plan) return;
        plan[field] = value;
        renderPlanManagement();
      }

      function updatePlanFeatures(portalKey, planId, selectEl) {
        const plans = plansDB[portalKey] || [];
        const plan = plans.find((p) => p.id === planId);
        if (!plan) return;
        const selected = Array.from(selectEl.options)
          .filter((o) => o.selected)
          .map((o) => o.value);
        plan.featureIds = selected;
      }

      function deletePlan(portalKey, planId) {
        if (!confirm("Delete this plan?")) return;
        plansDB[portalKey] = (plansDB[portalKey] || []).filter(
          (p) => p.id !== planId,
        );
        renderPlanManagement();
      }

      // Cart functions
      function addToCart(id, name, price, portalName) {
        if (cart.some((item) => item.id === id)) {
          showToast("This feature is already in your cart");
          return;
        }
        cart.push({ id, name, price, portalName });
        updateCartUI();
        showToast(`${name} added to cart`);
      }

      function updateCartUI() {
        document.getElementById("cart-count").textContent = cart.length;
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById("cart-total-header").textContent = `¥${total}`;
      }

      function toggleCart() {
        const panel = document.getElementById("cart-panel");
        const backdrop = document.getElementById("cart-backdrop");
        panel.classList.toggle("hidden");
        backdrop.classList.toggle("hidden");
        if (!panel.classList.contains("hidden")) renderCart();
      }

      function renderCart() {
        let html = "";
        let total = 0;
        cart.forEach((item, index) => {
          total += item.price;
          html += `
      <div class="flex justify-between bg-[#fbf8f5] p-5 rounded-3xl">
        <div>${item.name}</div>
        <div class="text-right">
          <div class="font-semibold text-[#ad986e]">¥${item.price}</div>
          <button onclick="removeFromCart(${index})" class="text-red-500 text-xs">Remove</button>
        </div>
      </div>`;
        });
        document.getElementById("cart-items").innerHTML =
          html ||
          `<div class="text-center py-12 text-gray-400">Cart is empty</div>`;
        document.getElementById("cart-total").textContent = `¥${total} / month`;
        document.getElementById("checkout-btn").disabled = cart.length === 0;
      }

      function removeFromCart(index) {
        cart.splice(index, 1);
        renderCart();
        updateCartUI();
      }

      function openCheckoutModal() {
        toggleCart();
        document.getElementById("checkout-modal").classList.remove("hidden");
        const total = cart.reduce((sum, item) => sum + item.price, 0);
        document.getElementById("modal-total").textContent = total;
      }

      function closeCheckoutModal() {
        document.getElementById("checkout-modal").classList.add("hidden");
      }

      function switchPayTab(tab) {
        document
          .getElementById("pay-gateway")
          .classList.toggle("hidden", tab === 1);
        document.getElementById("pay-qr").classList.toggle("hidden", tab === 0);
      }

      function completePayment() {
        alert("✅ Payment successful! This is a demo checkout only.");
        cart = [];
        closeCheckoutModal();
        updateCartUI();
      }

      function switchPortal(index) {
        currentPortal = index;
        document.querySelectorAll(".portal-tab").forEach((tab, i) => {
          tab.classList.toggle("portal-tab-active", i === index);
        });
        renderFeatures();
      }

      function showToast(msg) {
        const toast = document.createElement("div");
        toast.style.cssText =
          "position:fixed;bottom:24px;right:24px;background:#ad986e;color:white;padding:14px 24px;border-radius:9999px;box-shadow:0 10px 15px -3px rgb(0 0 0 / 0.2);z-index:99999";
        toast.textContent = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2500);
      }

      // Initialize
      window.onload = () => {
        renderFeatures();
        console.log(
          "%c✅ Yuushi Full Feature Store Mockup Loaded - All features restored",
          "color:#ad986e; font-weight:600",
        );
      };
